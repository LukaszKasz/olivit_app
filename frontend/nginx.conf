server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Backend endpoints when the /olivitqms prefix reaches this container directly.
    location /olivitqms/api/ {
        rewrite ^/olivitqms/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend endpoints when an upstream proxy strips /olivitqms before forwarding here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /me {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /olivitqms/me {
        rewrite ^/olivitqms/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login {
        if ($request_method = POST) {
            proxy_pass http://backend:8000;
            break;
        }
        try_files /index.html =404;
    }

    location = /register {
        if ($request_method = POST) {
            proxy_pass http://backend:8000;
            break;
        }
        try_files /index.html =404;
    }

    location = /olivitqms/login {
        if ($request_method = POST) {
            rewrite ^/olivitqms/(.*)$ /$1 break;
            proxy_pass http://backend:8000;
            break;
        }
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /olivitqms/register {
        if ($request_method = POST) {
            rewrite ^/olivitqms/(.*)$ /$1 break;
            proxy_pass http://backend:8000;
            break;
        }
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Static assets when an upstream proxy strips /olivitqms before forwarding here.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static assets when the /olivitqms prefix reaches this container directly.
    location /olivitqms/assets/ {
        rewrite ^/olivitqms/assets/(.*)$ /assets/$1 break;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache HTML entrypoints, otherwise the browser may keep old hashed asset names.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /olivitqms/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA routing - direct access with the /olivitqms prefix.
    location /olivitqms/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # SPA routing - access through an upstream proxy that already stripped /olivitqms.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
